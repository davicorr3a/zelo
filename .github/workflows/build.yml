name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # As actions ficam presas ao commit exato, não à tag, para ninguém trocar o código por baixo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      # Além do cache, confere se o gradle-wrapper.jar é o oficial.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Testes, lint e APK de debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zelo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Guardar os relatórios quando falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios
          path: app/build/reports/
          retention-days: 14
